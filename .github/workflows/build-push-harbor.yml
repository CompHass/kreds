name: Build and Push Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: eduhass/kreds
  MIGRATION_IMAGE_NAME: eduhass/kreds-migrate

jobs:
  build-scan-push:
    name: Build, scan, and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          image="${IMAGE_NAME}:${short_sha}"
          migration_image="${MIGRATION_IMAGE_NAME}:${short_sha}"
          latest_image="${IMAGE_NAME}:latest"
          latest_migration_image="${MIGRATION_IMAGE_NAME}:latest"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "migration_image=${migration_image}" >> "${GITHUB_OUTPUT}"
          echo "latest_image=${latest_image}" >> "${GITHUB_OUTPUT}"
          echo "latest_migration_image=${latest_migration_image}" >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub connectivity
        run: |
          getent hosts "${REGISTRY}"
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --verbose --connect-timeout 20 "https://${REGISTRY}/v2/" || test "$?" = "22"; then
              exit 0
            fi
            echo "Docker Hub connectivity attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Docker Hub login attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build image locally
        run: |
          for attempt in 1 2 3; do
            if docker build \
              --file ./Dockerfile \
              --target runner \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${{ steps.meta.outputs.image }}" \
              --tag "${{ steps.meta.outputs.latest_image }}" \
              .; then
              exit 0
            fi
            echo "Docker build attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build migration image locally
        run: |
          for attempt in 1 2 3; do
            if docker build \
              --file ./Dockerfile \
              --target migration \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${{ steps.meta.outputs.migration_image }}" \
              --tag "${{ steps.meta.outputs.latest_migration_image }}" \
              .; then
              exit 0
            fi
            echo "Docker migration build attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Print Trivy vulnerability report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on High or Critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest_image }}"
          docker push "${{ steps.meta.outputs.migration_image }}"
          docker push "${{ steps.meta.outputs.latest_migration_image }}"

      - name: Print deploy tag
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.image }}"
          echo "Latest image pushed: ${{ steps.meta.outputs.latest_image }}"
          echo "Migration image pushed: ${{ steps.meta.outputs.migration_image }}"
          echo "Latest migration image pushed: ${{ steps.meta.outputs.latest_migration_image }}"
          echo "Use tag: ${{ steps.meta.outputs.short_sha }}"
