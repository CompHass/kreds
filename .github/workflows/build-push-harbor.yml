name: Build and Push Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: harbor.hasslab.pro
  IMAGE_NAME: kreds/kreds

jobs:
  build-scan-push:
    name: Build, scan, and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          image="${REGISTRY}/${IMAGE_NAME}:${short_sha}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Harbor connectivity
        run: |
          getent hosts "${REGISTRY}"
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --verbose --connect-timeout 20 "https://${REGISTRY}/v2/" || test "$?" = "22"; then
              exit 0
            fi
            echo "Harbor connectivity attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "${HARBOR_PASSWORD}" | docker login "${REGISTRY}" --username "${HARBOR_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print Trivy vulnerability report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on High or Critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push immutable image
        run: docker push "${{ steps.meta.outputs.image }}"

      - name: Print deploy tag
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.image }}"
          echo "Use tag: ${{ steps.meta.outputs.short_sha }}"
