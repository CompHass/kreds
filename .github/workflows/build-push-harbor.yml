name: Build and Push Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: eduhass/kreds
  MIGRATION_IMAGE_NAME: eduhass/kreds-migrate

jobs:
  build-scan-push:
    name: Build, scan, and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::12}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-${GITHUB_RUN_NUMBER}"
          fi

          image="${IMAGE_NAME}:${VERSION}"
          migration_image="${MIGRATION_IMAGE_NAME}:${VERSION}"
          sha_image="${IMAGE_NAME}:${short_sha}"
          sha_migration_image="${MIGRATION_IMAGE_NAME}:${short_sha}"
          latest_image="${IMAGE_NAME}:latest"
          latest_migration_image="${MIGRATION_IMAGE_NAME}:latest"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "migration_image=${migration_image}" >> "${GITHUB_OUTPUT}"
          echo "sha_image=${sha_image}" >> "${GITHUB_OUTPUT}"
          echo "sha_migration_image=${sha_migration_image}" >> "${GITHUB_OUTPUT}"
          echo "latest_image=${latest_image}" >> "${GITHUB_OUTPUT}"
          echo "latest_migration_image=${latest_migration_image}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check Docker Hub connectivity
        run: |
          getent hosts "${REGISTRY}"
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --verbose --connect-timeout 20 "https://${REGISTRY}/v2/" || test "$?" = "22"; then
              exit 0
            fi
            echo "Docker Hub connectivity attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin; then
              exit 0
            fi
            echo "Docker Hub login attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build image locally
        run: |
          for attempt in 1 2 3; do
            if docker build \
              --file ./Dockerfile \
              --target runner \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
              --tag "${{ steps.meta.outputs.image }}" \
              --tag "${{ steps.meta.outputs.sha_image }}" \
              --tag "${{ steps.meta.outputs.latest_image }}" \
              .; then
              exit 0
            fi
            echo "Docker build attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Build migration image locally
        run: |
          for attempt in 1 2 3; do
            if docker build \
              --file ./Dockerfile \
              --target migration \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
              --tag "${{ steps.meta.outputs.migration_image }}" \
              --tag "${{ steps.meta.outputs.sha_migration_image }}" \
              --tag "${{ steps.meta.outputs.latest_migration_image }}" \
              .; then
              exit 0
            fi
            echo "Docker migration build attempt ${attempt} failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Print Trivy vulnerability report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on High or Critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.sha_image }}"
          docker push "${{ steps.meta.outputs.latest_image }}"
          docker push "${{ steps.meta.outputs.migration_image }}"
          docker push "${{ steps.meta.outputs.sha_migration_image }}"
          docker push "${{ steps.meta.outputs.latest_migration_image }}"

      - name: Print deploy tag
        run: |
          echo "=== Kreds build complete ==="
          echo "Version: ${{ steps.meta.outputs.version }}"
          echo "Primary image: ${{ steps.meta.outputs.image }}"
          echo "Migration image: ${{ steps.meta.outputs.migration_image }}"
          echo "SHA image: ${{ steps.meta.outputs.sha_image }}"
          echo "Latest image: ${{ steps.meta.outputs.latest_image }}"
          echo ""
          echo "For ArgoCD, use tag: ${{ steps.meta.outputs.version }}"
          echo "Trigger: ${{ github.ref_type }} (${{ github.ref_name }})"

  update-manifests:
    name: Update kustomize manifests
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout iac repo
        uses: actions/checkout@v4
        with:
          repository: CompHass/iac
          token: ${{ secrets.IAC_DEPLOY_TOKEN }}
          ref: main

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=0.1.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update kustomization image tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          FILE="manifests/kreds/kustomization.yaml"

          yq -i '(.images[] | select(.name == "docker.io/eduhass/kreds")).newTag = strenv(TAG)' "$FILE"
          yq -i '(.images[] | select(.name == "docker.io/eduhass/kreds-migrate")).newTag = strenv(TAG)' "$FILE"

          echo "Updated $FILE:"
          cat "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/kreds/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(kreds): bump image tags to ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin main
