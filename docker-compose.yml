services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kreds
      POSTGRES_PASSWORD: kreds_dev
      POSTGRES_DB: kreds_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreds -d kreds_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kreds:kreds_dev@postgres:5432/kreds_dev
      NODE_ENV: production
      AUTH_SECRET: dev-secret-32-chars-minimum-here
      CHILD_SESSION_SECRET: dev-child-session-secret-32chars!!
      PIN_ENCRYPTION_KEY: dhA/bC7ugD4I5gx4omcLQOivxxwDWe8tDJa/710JQRE=
      IAM_LOGIN_CLIENT: ${IAM_LOGIN_CLIENT:?IAM_LOGIN_CLIENT must be set for native guardian login}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_ZITADEL_ID: ${AUTH_ZITADEL_ID:-dev-client-id}
      AUTH_ZITADEL_SECRET: ${AUTH_ZITADEL_SECRET:-dev-client-secret}
      AUTH_ZITADEL_ISSUER: https://auth.hasslab.pro
      ZITADEL_ISSUER: https://auth.hasslab.pro
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
