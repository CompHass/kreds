services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kreds
      POSTGRES_PASSWORD: kreds_dev
      POSTGRES_DB: kreds_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreds"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
