<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Meus Sonhos - Sylvan Growth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        body {
            background: linear-gradient(to bottom, #F0F4F0, #FFFFFF);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(45, 90, 39, 0.1);
            box-shadow: 0 8px 32px rgba(45, 90, 39, 0.05);
        }

        .floating-shadow {
            box-shadow: 0 12px 40px rgba(45, 90, 39, 0.08);
        }

        .blob-shape-1 {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        
        .blob-shape-2 {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
        }

        .sunkissed-gradient {
            background: linear-gradient(135deg, var(--tw-colors-surface-tint), var(--tw-colors-primary-container));
            box-shadow: inset 0 2px 0 rgba(210, 165, 1, 0.3), 0 4px 12px rgba(45, 90, 39, 0.15);
        }

        .progress-vine {
            background-image: repeating-linear-gradient(
                -45deg,
                rgba(255,255,255,0.1),
                rgba(255,255,255,0.1) 10px,
                transparent 10px,
                transparent 20px
            );
            background-size: 28px 28px;
            animation: moveVine 2s linear infinite;
        }

        @keyframes moveVine {
            0% { background-position: 0 0; }
            100% { background-position: 28px 0; }
        }

        .squishy-active:active {
            transform: scale(0.96);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* Subtle organic background decoration */
        .bg-deco {
            position: fixed;
            z-index: -1;
            opacity: 0.4;
            filter: blur(40px);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline-variant": "#c2c9bb",
                      "on-tertiary-fixed": "#241a00",
                      "surface": "#fff8f5",
                      "secondary": "#4c6700",
                      "on-surface-variant": "#42493e",
                      "on-error-container": "#93000a",
                      "tertiary": "#755b00",

                      "surface-bright": "#fff8f5",
                      "surface-container": "#ffeadc",
                      "surface-container-high": "#ffe3cf",
                      "surface-dim": "#f2d4bf",
                      "primary-container": "#2d5a27",
                      "tertiary-container": "#d2a501",
                      "error": "#ba1a1a",
                      "outline": "#72796e",
                      "on-primary-fixed": "#002201",
                      "on-primary-container": "#9dd090",
                      "on-tertiary-container": "#503d00",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#a1d494",
                      "surface-container-low": "#fff1e9",
                      "primary": "#154212",
                      "inverse-surface": "#3f2d1e",
                      "on-background": "#28180b",
                      "secondary-container": "#caec7d",
                      "on-secondary-container": "#506b03",
                      "background": "#fff8f5",
                      "on-secondary-fixed": "#151f00",
                      "inverse-on-surface": "#ffede2",
                      "surface-variant": "#fbddc7",
                      "on-secondary-fixed-variant": "#394d00",
                      "on-tertiary-fixed-variant": "#584400",
                      "inverse-primary": "#a1d494",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#cdef7f",
                      "primary-fixed": "#bcf0ae",
                      "tertiary-fixed": "#ffdf90",
                      "on-tertiary": "#ffffff",
                      "tertiary-fixed-dim": "#f0c12c",
                      "on-primary": "#ffffff",
                      "surface-container-highest": "#fbddc7",

                      "on-secondary": "#ffffff",
                      "secondary-fixed-dim": "#b2d266"

              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-padding": "24px",
                      "base": "8px",
                      "section-margin": "48px",
                      "element-gap": "16px"
              },
              "fontFamily": {
                      "label-sm": [
                              "Be Vietnam Pro"
                      ],
                      "body-md": [
                              "Be Vietnam Pro"
                      ],
                      "headline-xl": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg-mobile": [
                              "Plus Jakarta Sans"
                      ],
                      "headline-lg": [
                              "Plus Jakarta Sans"
                      ]
              },
              "fontSize": {
                      "label-sm": [
                              "12px",
                              {

                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-xl": [
                              "40px",
                              {
                                      "lineHeight": "48px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased overflow-x-hidden relative">
<!-- Atmospheric Background Decoration -->
<div class="bg-deco bg-primary-fixed-dim w-[300px] h-[300px] rounded-full top-[-100px] left-[-100px]"></div>
<div class="bg-deco bg-tertiary-fixed w-[250px] h-[250px] rounded-full bottom-[100px] right-[-50px]"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-sm">
<div class="flex justify-between items-center px-container-padding h-16 w-full">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container border-2 border-primary-fixed">
<img alt="Child profile avatar with forest crown" class="w-full h-full object-cover" data-alt="A highly detailed, soft 3D clay-style render of a young child's avatar wearing a magical forest crown made of glowing green leaves and small golden acorns. The lighting is bright and cheerful, set against a pristine white light-mode background. The color palette features vibrant sage greens and earthy browns, ensuring a premium organic aesthetic that feels safe and playful." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAAA63bskSPShIhsVhA7zNOnvzTlNR9K14mC35yZdvA9aRHyVfdJdj25TZi51HjRveB0ELEuvYD_NL0R-4ji3JkqWt7Gr_3MLHxdJfZllrAIHgNcjUwUFi5W-0X_bfh4LJ2s_XB4QixJToBSLSFd4wHod01JuSxJLDcXks6MEtBzGvmJ_AYTLHqz7-tcWrIpb29JuLGg5QmD9mbh2EOaTdGdlN8GnMhLVNd0ou0Esn67EyMeTUVWLFdqwf4EOcS4w-VHTHdWuyX58Q"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Sylvan Growth</h1>
<button class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface-container transition-colors squishy-active">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-container-padding max-w-md mx-auto md:max-w-4xl md:pt-32">
<!-- Header Section -->
<div class="mb-8 text-center">
<h2 class="font-headline-xl text-headline-xl text-primary-container mb-2">Meus Sonhos</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Cultivando o seu futuro, uma semente de cada vez.</p>
</div>
<!-- Hero Glass Card: Total Saved -->
<div class="glass-card rounded-[32px] p-8 mb-10 text-center relative overflow-hidden group">
<!-- Decorative inner glow -->
<div class="absolute inset-0 bg-gradient-to-tr from-white/40 to-transparent pointer-events-none"></div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Total Guardado</p>
<div class="flex items-center justify-center gap-3">
<div class="w-12 h-12 bg-tertiary-container/20 rounded-full flex items-center justify-center text-tertiary-container blob-shape-1 shadow-inner">
<span class="material-symbols-outlined text-3xl fill">eco</span>
</div>
<h3 class="font-headline-xl text-headline-xl text-primary">450 <span class="text-2xl text-outline">Kreds</span></h3>
</div>
</div>
<!-- Goal Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-element-gap">
<!-- Goal 1: Bicicleta Nova -->
<div class="glass-card rounded-[28px] p-5 relative transition-transform hover:-translate-y-1 duration-300">
<div class="flex items-start gap-4 mb-6">
<div class="w-20 h-20 bg-surface-container rounded-2xl flex items-center justify-center p-2 shadow-sm border border-outline-variant/30">
<img alt="3D Bicycle" class="w-full h-full object-contain drop-shadow-md" data-alt="A highly detailed, soft 3D clay-style render of a classic red and white child's bicycle resting on a small patch of mossy grass. The lighting is bright, soft, and diffused, creating a premium organic and inviting light-mode aesthetic. The colors are vivid yet pastel, fitting a high-end UI designed to nurture growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3p_KWL8NJz8B1jODr7IFV8QbeBc2T1Xl2Q30S4PxJbQO1Qy5iCViezByFHDMdZ42JbP8ssZa9nEjUIeYn8pfpdmyZdPbY1eLXNAw6nP86OkCuwBpLQ69fp_aZm7pS6Y41vGPo0KbW00X1h3G_ZQU3x5dfBhBzRwGNruSf6R2KbXQd_AJeX1udastSNWCvyK-ewV9zu5iVdt9q_VwJ8kw23nN5yWakIIHHTthZekCdGkZFpYknpEgIXpIprhgeaL2CuWjuYbGFQbA"/>
</div>
<div class="flex-1">
<h4 class="font-headline-lg-mobile text-[22px] leading-[28px] text-primary-container font-bold mb-1">Bicicleta Nova</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-tertiary-container">stars</span>
                            Faltam 150 Kreds
                        </p>
</div>
</div>
<!-- Progress Vine -->
<div class="w-full h-6 bg-surface-container-high rounded-full overflow-hidden shadow-inner relative border border-outline-variant/20">
<div class="h-full sunkissed-gradient rounded-full progress-vine relative" style="width: 60%;">
<!-- Bloom tip -->
<div class="absolute right-0 top-0 bottom-0 w-4 bg-tertiary-fixed blur-[4px] rounded-full opacity-80"></div>
</div>
</div>
<div class="mt-2 text-right">
<span class="font-label-sm text-label-sm text-primary-fixed-dim">60% cultivado</span>
</div>
</div>
<!-- Goal 2: Jogo de Tabuleiro -->
<div class="glass-card rounded-[28px] p-5 relative transition-transform hover:-translate-y-1 duration-300">
<div class="flex items-start gap-4 mb-6">
<div class="w-20 h-20 bg-surface-container rounded-2xl flex items-center justify-center p-2 shadow-sm border border-outline-variant/30">
<img alt="3D Board Game" class="w-full h-full object-contain drop-shadow-md" data-alt="A highly detailed, soft 3D clay-style render of a colorful board game box slightly open, revealing playful game pieces like dice and tokens. It rests on a subtle frosted glass surface. The lighting is optimistic and bright, capturing a premium organic light-mode aesthetic suitable for children. The colors are warm, utilizing soft earthy tones and vibrant secondary pops." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAN7a4THHjENoB4VnPkTqVVBB8QUE2Gq-zQE8qmsALfPlHlsE5Z7j2rgNvJBpcmAIwdvGQ-oy0bH3AWFNLFzIQc3hVGfoOlelt9Wh_knE7KKnx1NDSAedXuxyiQ_CFMP9cwgIyPE_6UcAl5sgkdnyYOgDWb9TwbwsMfnpPklp3g9ACYCa9RllOjSe1pZD9sDK5u7lxLvDpE5tpY5rYu1mUL0M_UuEIEzzyZfR3NTzT9wLNLoCkVrAkcOhLiUkSHGLa94oKOxmtXwjU"/>
</div>
<div class="flex-1">
<h4 class="font-headline-lg-mobile text-[22px] leading-[28px] text-primary-container font-bold mb-1">Jogo de Tabuleiro</h4>
<p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-tertiary-container">stars</span>
                            Faltam 80 Kreds
                        </p>
</div>
</div>
<!-- Progress Vine -->
<div class="w-full h-6 bg-surface-container-high rounded-full overflow-hidden shadow-inner relative border border-outline-variant/20">
<div class="h-full sunkissed-gradient rounded-full progress-vine relative" style="width: 20%;">
<!-- Bloom tip -->
<div class="absolute right-0 top-0 bottom-0 w-4 bg-tertiary-fixed blur-[4px] rounded-full opacity-80"></div>
</div>
</div>
<div class="mt-2 text-right">
<span class="font-label-sm text-label-sm text-primary-fixed-dim">20% cultivado</span>
</div>
</div>
<!-- Action: Plantar Novo Sonho -->
<button class="w-full h-full min-h-[160px] rounded-[28px] border-2 border-dashed border-primary-fixed-dim/50 bg-surface/30 hover:bg-surface/60 transition-colors flex flex-col items-center justify-center gap-3 squishy-active group">
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:scale-110 transition-transform duration-300 shadow-sm">
<span class="material-symbols-outlined text-3xl">add</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Plantar Novo Sonho</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-xl bg-surface-container-low/90 dark:bg-inverse-surface/90 backdrop-blur-2xl shadow-[0_-4px_20px_rgba(45,90,39,0.08)] z-50 flex justify-around items-center px-4 pt-3 pb-safe md:hidden h-20">
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 squishy-active w-16">
<span class="material-symbols-outlined mb-1">park</span>
<span class="font-label-sm text-[10px]">Forest</span>
</button>
<!-- Active Tab: Missions (mapped to Goals/Dreams intent) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1.5 transition-all duration-500 scale-90 squishy-active w-20">
<span class="material-symbols-outlined fill mb-1">assignment_turned_in</span>
<span class="font-label-sm text-[10px] font-bold">Missions</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 squishy-active w-16">
<span class="material-symbols-outlined mb-1">local_florist</span>
<span class="font-label-sm text-[10px]">Garden</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:opacity-100 squishy-active w-16">
<span class="material-symbols-outlined mb-1">account_tree</span>
<span class="font-label-sm text-[10px]">Legacy</span>
</button>
</nav>
</body></html>
